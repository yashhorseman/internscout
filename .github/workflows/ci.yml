name: tests
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      db:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: internscout}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/internscout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m app.db migrate
      - run: pytest -q
