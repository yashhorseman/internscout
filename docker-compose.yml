services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres   # local development only
      POSTGRES_DB: internscout
    ports:
      - "127.0.0.1:5432:5432"       # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internscout"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
