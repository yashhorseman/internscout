services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres   # local development only
      POSTGRES_DB: internscout
    ports:
      - "127.0.0.1:5432:5432"       # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internscout"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file:
      - path: .env               # GEMINI_API_KEY; the database address below wins
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/internscout
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
